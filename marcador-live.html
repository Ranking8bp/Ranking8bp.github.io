<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking8BP · LIVE</title><style>html,body{margin:0;background:transparent;color:white;font-family:Arial}.panel{margin:8px;padding:15px;width:550px;background:#071c26;border:2px solid #ddbb61;border-radius:16px;text-align:center}.title{font-weight:900;font-size:21px;color:#ffdb7c}.stats{display:flex;gap:8px;margin-top:12px}.item{flex:1;background:#163041;border-radius:10px;padding:12px}.number{font-weight:900;font-size:44px}#wins{color:#6bf1ad}#losses{color:#ff9999}#remaining{color:#a6d4ff}.label{font-size:12px;font-weight:bold}.footer{font-size:13px;margin-top:12px}</style></head><body><div class="panel"><div class="title">🎱 CLASIFICATORIA DIARIA</div><div id="player">IKAR8BP</div><div class="stats"><div class="item"><div class="number" id="wins">0</div><div class="label">GANADAS</div></div><div class="item"><div class="number" id="losses">0</div><div class="label">PERDIDAS</div></div><div class="item"><div class="number" id="remaining">15</div><div class="label">RESTANTES</div></div></div><div class="footer" id="footer">CARGANDO...</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config-v3.js"></script><script>const u=new URLSearchParams(location.search).get('usuario')||'ikar8bp';const el=id=>document.getElementById(id);const s=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key,{auth:{persistSession:false,autoRefreshToken:false}});let busy=false;async function refresh(){if(busy)return;busy=true;try{const {data,error}=await s.rpc('daily_classification_stream_stats',{p_username:u});if(error)throw error;if(!data.found)throw Error('Usuario no encontrado');el('player').textContent=data.name||u;for(const k of ['wins','losses','remaining'])el(k).textContent=data[k];el('footer').textContent=data.played+' / 15 PARTIDAS'+(data.pending?' · '+data.pending+' EN REVISIÓN':'')+' · EN VIVO'}catch(e){el('footer').textContent='CONECTANDO CON RANKING8BP...'}finally{busy=false}}refresh();setInterval(refresh,10000)</script></body></html>
